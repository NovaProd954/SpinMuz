workflows:
  spinmuz-android:
    name: SpinMuz Android APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Set SDK path
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build release APK
        script: cd android && ./gradlew assembleRelease --no-daemon -PappVersionCode=$BUILD_NUMBER -PappVersionName=1.0.$BUILD_NUMBER
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
