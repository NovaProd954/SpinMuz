apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    debuggableVariants = []
}

def releaseStoreFile = System.getenv("RELEASE_KEYSTORE_PATH")
def hasReleaseKey = releaseStoreFile && file(releaseStoreFile).exists() && System.getenv("RELEASE_STORE_PASSWORD") && System.getenv("RELEASE_KEY_ALIAS") && System.getenv("RELEASE_KEY_PASSWORD")

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.spinmuz"

    defaultConfig {
        applicationId "com.spinmuz"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode (project.findProperty("appVersionCode") ?: "1").toInteger()
        versionName (project.findProperty("appVersionName") ?: "1.0.0")
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.10"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        if (hasReleaseKey) {
            release {
                storeFile file(releaseStoreFile)
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ["**/libc++_shared.so"]
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    implementation "androidx.core:core-ktx:1.12.0"

    implementation platform("androidx.compose:compose-bom:2024.02.02")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"

    implementation "androidx.glance:glance-appwidget:1.0.0"
    implementation "androidx.glance:glance-material3:1.0.0"

    implementation "androidx.palette:palette-ktx:1.0.0"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
