name: Build SpinMuz APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="1.0.${{ github.run_number }}"
            TAG="v$VERSION"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Prepare release keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/android/app/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=$VERSION 2>&1 | tee ../build.log; exit ${PIPESTATUS[0]}

      - name: Surface build errors
        if: failure()
        shell: bash
        run: |
          E=$(grep -E '^e: ' build.log | head -40 | sed 's#file:///home/runner/work/SpinMuz/SpinMuz/android/app/src/main/java/com/spinmuz/##' | awk '{printf "%s%%0A", substr($0,1,400)}')
          echo "::error title=Kotlin errors::${E:-none}"
          F=$(sed -n '/^FAILURE:/,$p' build.log | grep -v '^$' | head -12 | awk '{printf "%s%%0A", substr($0,1,300)}')
          echo "::error title=Gradle failure::${F:-none}"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "SpinMuz-v$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SpinMuz-apk
          path: SpinMuz-v*.apk

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: SpinMuz ${{ env.TAG }}
          files: SpinMuz-v*.apk
          generate_release_notes: true
          make_latest: true
